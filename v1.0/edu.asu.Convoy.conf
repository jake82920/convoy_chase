<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the dedicated server account may own the game server name. -->
  <policy user="server">
    <allow own="edu.asu.Convoy.Server"/>
    <allow send_destination="*"/>
  </policy>

  <!-- Each dedicated player account may call only the game server. -->
  <policy user="player1">
    <allow send_destination="edu.asu.Convoy.Server"/>
  </policy>
  <policy user="player2">
    <allow send_destination="edu.asu.Convoy.Server"/>
  </policy>
  <policy user="player3">
    <allow send_destination="edu.asu.Convoy.Server"/>
  </policy>
  <policy user="player4">
    <allow send_destination="edu.asu.Convoy.Server"/>
  </policy>
</busconfig>
